<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1B1B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shimmerF" x1="-30%" y1="0%" x2="30%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E91E63" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1F8E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
      <animate attributeName="x1" values="-50%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;150%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" fill="url(#bgF)"/>

  <rect x="200" y="59" width="800" height="2" fill="#FFFFFF" opacity="0.08"/>
  <rect x="200" y="59" width="800" height="2" fill="url(#shimmerF)"/>
</svg>
